{%  extends 'core/base.html' %}
{%  load static %}
{%  block title %}Edit Profile{%  endblock %}
{%  block content %}

<h1>Edit Profile</h1>

<div class = "mass">
    <form method = "POST" enctype = "multipart/form-data" class = "speed">
        {%  csrf_token %}
        <div>
            {% if profile.profile_image %}
                <img src="{{ profile.profile_image.url }}" alt="Current profile image" class = "accelerate">
            {% endif %}
            <input type="file" name="profile_image" accept="image/*">
        </div>
        <div class = "displace">
            <div class = "quantity">
                <input type = "text" name = "first_name" value = "{{profile.first_name}}" class = "weight">
            </div>
            <div class = "quantity">
                <input type = "text" name = "last_name"  value = "{{profile.last_name}}" class = "weight">
            </div>
            </div>
        <div>
            <input type = "text" name = "location" value = "{{profile.location}}" class = "weight">
        </div>
        <button type = "submit" class = "dynamics">Edit Profile</button>
    </form>
</div>



{%  endblock %}
