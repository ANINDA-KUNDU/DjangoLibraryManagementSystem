{%  load static %}
<header>
    <nav>
        <div>
            <a href = "{% url 'home' %}" class = "bottle">AnindaLibrary</a>
        </div>
        <div class = "burger" id = "burger" onclick = "toggleMenu()">
            &#9776;
        </div>
        <div class = "fish" id = "menu">
            <a href = "{%  url 'home' %}" class = "curry">Home</a>
            {% if user.is_authenticated %}
                <a href = "{%  url 'logout' %}" class = "curry">Logout</a>
                {%  if request.user.is_authenticated and request.user.profile  %}
                    <a href = "{%  url 'profile' request.user.profile.id %}" class = "curry">Profile</a>
                {%  endif %}
                <a href = "{% url 'issue_book'  %}" class = "curry">Issue Book</a>
            {%  else  %}
                <a href = "{%  url 'signup' %}" class = "curry">Signup</a>
                <a href = "{%  url 'login' %}" class = "curry">Login</a>
            {% endif %}
        </div>
    </nav>
</header>

{%  block script %}
    <script>
        function toggleMenu(){
            document.getElementById("burger").classList.toggle("show");
            document.getElementById("menu").classList.toggle("active");
            document.body.classList.toggle("menu-open");
        }
    </script>
{%  endblock %}
